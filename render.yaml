# PAGE CHECK — Render Free (2 Web Services). Monthly instance-hours are shared.
# All public URL audits remain DISABLED until hosted security and 512 MB
# Chromium resource checks have passed. No paid private/cron plans are declared.
services:
  - type: web
    name: pagecheck-api
    runtime: docker
    region: ohio
    plan: free
    autoDeployTrigger: 'off'
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    dockerCommand: /bin/sh /app/deploy/start_api_render_free.sh
    healthCheckPath: /health
    envVars:
      - key: PAGECHECK_ENV
        value: production
      - key: PAGECHECK_ALLOW_LIVE_FETCH
        value: "0"
      - key: PAGECHECK_ALLOW_LIVE_BROWSER
        value: "0"
      - key: PAGECHECK_ALLOW_LOCAL_STATIC_ENGINES
        value: "0"
      - key: PAGECHECK_PUBLIC_AUDITS_ENABLED
        value: "0"
      - key: PAGECHECK_EGRESS_ISOLATED
        value: "0"
      - key: PAGECHECK_PRIVATE_API_KEY
        generateValue: true
      - key: PAGECHECK_DATABASE_URL
        sync: false # Neon database URL; set in Render secrets, never in git.

  - type: web
    name: pagecheck-ui
    runtime: docker
    region: ohio
    plan: free
    autoDeployTrigger: 'off'
    dockerfilePath: ./deploy/Dockerfile.ui
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: PAGECHECK_ENV
        value: production
      - key: PAGECHECK_STORAGE_BACKEND
        value: postgres_temporary
      - key: PAGECHECK_PUBLIC_AUDITS_ENABLED
        value: "0"
      - key: PAGECHECK_EGRESS_ISOLATED
        value: "0"
      - key: PAGECHECK_ALLOW_LIVE_FETCH
        value: "0"
      - key: PAGECHECK_ALLOW_LIVE_BROWSER
        value: "0"
      - key: PAGECHECK_UI_IDLE_GUARD
        value: "1"
      - key: PAGECHECK_UI_IDLE_MINUTES
        value: "15"
      # HTTPS service-to-service requests; no Render private network required.
      - key: PAGECHECK_API_URL
        fromService:
          name: pagecheck-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAGECHECK_PRIVATE_API_KEY
        fromService:
          name: pagecheck-api
          type: web
          envVarKey: PAGECHECK_PRIVATE_API_KEY
